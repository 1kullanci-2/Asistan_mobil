name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Derle
        run: gradle assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Sürüm olarak yayınla (telefondan doğrudan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum app/build/outputs/apk/debug/app-debug.apk \
            --title "Son sürüm" --notes "Otomatik derleme: ${{ github.sha }}" --prerelease
