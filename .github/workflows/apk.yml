name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  derle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 50
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Derle
        run: |
          set -o pipefail
          gradle assembleDebug --stacktrace 2>&1 | tee derleme.log || {
            grep -E "^e: |What went wrong" -A2 derleme.log | head -40 | while IFS= read -r l; do echo "::error::$l"; done
            exit 1
          }
      - uses: actions/upload-artifact@v4
        with:
          name: edith-apk
          path: app/build/outputs/apk/debug/*.apk
      - name: Sürüm olarak yayınla (telefondan doğrudan indirmek için)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          SURUM="0.3.${GITHUB_RUN_NUMBER}"
          ESKI=$(gh release view son-surum --json body -q .body 2>/dev/null || true)
          ONCE="${{ github.event.before }}"
          if [ -z "$ONCE" ] || [ "$ONCE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$ONCE" 2>/dev/null; then ONCE="HEAD~1"; fi
          DEGISIM=$(git log "$ONCE..HEAD" --no-merges --max-count=20 --pretty='- %s' 2>/dev/null || true)
          [ -z "$DEGISIM" ] && DEGISIM="- Genel iyileştirmeler"
          GECMIS=$(printf '%s\n' "$ESKI" | awk '/^## /{p=1} p' | awk '/^## /{n++} n<=11')
          {
            echo "Sürüm: $SURUM"
            echo
            echo "## $SURUM"
            echo "$DEGISIM"
            echo
            [ -n "$GECMIS" ] && printf '%s\n' "$GECMIS"
          } > notlar.md
          gh release delete son-surum --cleanup-tag -y || true
          gh release create son-surum app/build/outputs/apk/debug/app-debug.apk \
            --title "Son sürüm" --notes-file notlar.md --prerelease
